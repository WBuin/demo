rgin:14px 2px 8px}.section-title h3{font-size:16px;margin:0}.section-title small{color:var(--muted)}.choices{display:grid;gap:9px}.choice{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px;box-shadow:var(--shadow);display:grid;grid-template-columns:28px 1fr;gap:8px;transition:.18s}.choice.selected{border-color:#83c8be;box-shadow:0 0 0 2px #d8f1ed,var(--shadow)}.choice input{width:20px;height:20px;accent-color:var(--teal);margin:3px 0 0}.choice-main{min-width:0}.choice-top{display:flex;align-items:flex-start;gap:7px;flex-wrap:wrap}.choice-name{font-size:16px;font-weight:800}.rating{color:#d28622;font-size:12px;letter-spacing:0}.badge{font-size:11px;border-radius:6px;padding:2px 6px;background:#e4f3ec;color:var(--good);font-weight:700}.badge.must{background:#ffe6df;color:#b54936}.badge.alt{background:#edf0f1;color:#66777a}.choice-meta{color:var(--muted);font-size:12px;margin-top:4px}.choice-desc{margin:6px 0 0;font-size:13px}.choice-bottom{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}.zone{font-size:11px;color:#4c7776;background:var(--sea);border-radius:6px;padding:3px 7px}.mini-nav,.nav{display:inline-block;text-decoration:none;color:var(--teal);background:var(--teal-2);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:800}.timeline{display:grid;gap:9px}.stop{display:grid;grid-template-columns:63px 1fr;gap:10px}.time{color:var(--teal);font-weight:800;padding-top:13px;text-align:right;font-size:13px}.plan-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px 12px;box-shadow:var(--shadow)}.plan-card .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.plan-card .title{font-weight:800;font-size:15px}.plan-card .meta{color:var(--muted);font-size:12px;margin-top:4px}.plan-card .desc{font-size:13px;margin:6px 0 0}.warning{background:#fff0ed;border:1px solid #f3c5bc;color:#944535;border-radius:13px;padding:10px 12px;margin:10px 0;font-size:13px}.good{background:#edf const baseline=JSON.parse(JSON.stringify(dayData));
function load(){try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved){dayData.forEach(d=>{const s=saved[d.id];if(!s)return;if(s.start)d.start=s.start;d.stops.forEach(x=>{if(s.selected&&x.name in s.selected)x.selected=s.selected[x.name]})})}}catch(e){}}
function save(){const out={};dayData.forEach(d=>{out[d.id]={start:d.start,selected:Object.fromEntries(d.stops.map(x=>[x.name,!!x.selected]))}});localStorage.setItem(STORAGE,JSON.stringify(out))}
function stars(n){return n?'<span class="rating" aria-label="'+n+'星">'+('★'.repeat(n))+('☆'.repeat(5-n))+'</span>':''}
function mins(n){if(!n)return '—';return n>=60?Math.floor(n/60)+'小时'+(n%60?` ${n%60}分`:''):n+'分钟'}
function parseTime(v){const [h,m]=v.split(':').map(Number);return h*60+m}
function fmt(n){n=(n+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function selected(d){return d.stops.filter(x=>x.selected)}
function calc(d){let t=parseTime(d.start),drive=0,play=0;const rows=[];selected(d).forEach((s,i)=>{if(i&&s.travel){t+=s.travel;drive+=s.travel}const begin=t;t+=s.duration||0;play+=s.duration||0;rows.push({s,begin,end:t})});return {rows,drive,play,end:t}}
function renderTabs(){document.getElementById('tabs').innerHTML=dayData.map(d=>`<button class="tab ${d.id===activeDay?'active':''}" data-day="${d.id}">${d.date}<br><small>${d.short}</small></button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeDay=b.dataset.day;render()})}
function mapBlock(d, c){const pts=c.rows.filter(x=>x.s.address);let route=pts.map((x,i)=>`${i?'<span class="route-arrow">→</span>':''}<div class="route-point"><b>${i+1} · ${x.s.name}</b><span>${x.s.zone}</span></div>`).join('');const first=pts[0]?.s.address||'';const points=pts.map(x=>x.s.name).join('、');const url='https://uri.amap.com/search?keyword='+encodeURIComponent(points||d.title);return `<div class="mapbox"><div class="maptop"><strong>今日路线 · ${pts.length} 个点</strong><small>片区：${[...new Set(pts.map(x=>x.s.zone))].join(' / ')}</small></div><div class="route">${route||'<span class="route-point">请先选择景点</span>'}</div><div class="map-actions"><a class="button primary" target="_blank" href="${url}">在高德查看点位</a><a class="button ghost" target="_blank" href="https://uri.amap.com/search?keyword=${encodeURIComponent(first)}">导航到第一站</a></div></div>`}
function choiceCard(d,s,i){return `<label class="choice ${s.selected?'selected':''}"><input type="checkbox" data-index="${i}" ${s.selected?'checked':''}><div class="choice-main"><div class="choice-top"><span class="choice-name">${s.name}</span>${stars(s.rating)}<span class="badge ${s.must?'must':s.level==='新增推荐'?'alt':''}">${s.level}</span></div><div class="choice-meta">${s.duration?`停留 ${mins(s.duration)} · `:''}${s.travel?`通勤约 ${s.travel} 分钟 · `:''}${s.address||'自定义地址'}</div><p class="choice-desc">${s.desc||''}</p><div class="choice-bottom"><span class="zone">${s.zone}</span>${s.address?`<a class="mini-nav" target="_blank" href="https://uri.amap.com/search?keyword=${encodeURIComponent(s.address)}" onclick="event.stopPropagation()">地图</a>`:''}</div></div></label>`}
function timeline(c){if(!c.rows.length)return '<div class="good">还没有选择景点，勾选上方卡片后会自动生成时间线。</div>';return `<div class="timeline">${c.rows.map(r=>`<div class="stop"><div class="time">${fmt(r.begin)}</div><article class="plan-card"><div class="row"><span class="title">${r.s.name}</span>${stars(r.s.rating)}<span class="badge ${r.s.must?'must':''}">${r.s.level}</span></div><div class="meta">${r.s.duration?`停留 ${mins(r.s.duration)} · `:''}${r.s.travel?`从上一站通勤 ${r.s.travel} 分钟`:''}</div><p class="desc">${r.s.desc||''}</p><a class="nav" target="_blank" href="https://uri.amap.com/search?keyword=${encodeURIComponent(r.s.address||r.s.name)}">一键导航</a></article></div>`).join('')}</div>`}
function render(){load();const d=dayData.find(x=>x.id===activeDay)||dayData[0],c=calc(d),arr=selected(d);renderTabs();document.getElementById('content').innerHTML=`<section class="day active"><div class="dayhead"><h2>${d.date} · ${d.title}</h2><small>${d.sub}</small></div><div class="notice"><strong>今天：</strong>${d.note}</div><div class="toolbar"><button class="button primary" id="addBtn">＋ 添加景点</button><button class="button ghost" id="clearBtn">清空可选</button><button class="button" id="resetBtn">恢复原计划</button><label class="time-control">出发 <input type="time" id="startTime" value="${d.start}"></label></div><div class="summary"><div><b>${arr.length}</b><span>已选点</span></div><div><b>${mins(c.play)}</b><span>游玩时间</span></div><div class="${c.drive>d.maxDrive?'alert':'ok'}"><b>${mins(c.drive)}</b><span>通勤时间</span></div><div class="${c.end>parseTime('22:30')?'alert':'ok'}"><b>${fmt(c.end)}</b><span>预计结束</span></div></div>${c.drive>d.maxDrive?`<div class="warning">通勤约 <b>${mins(c.drive)}</b>，超过今天建议上限 ${mins(d.maxDrive)}。优先取消带有“新增推荐”或通勤最长的点，让景点保持在同一片区。</div>`:`<div class="good">当前路线集中在 ${[...new Set(arr.map(x=>x.zone))].join('、')||'同一片区'}，通勤在建议范围内。</div>`}${mapBlock(d,c)}<div class="section-title"><h3>选择今天的景点</h3><small>推荐度越高越优先</small></div><div class="choices">${d.stops.map((s,i)=>choiceCard(d,s,i)).join('')}</div><div class="section-title"><h3>自动时间线</h3><small>勾选后自动重排</small></div>${timeline(c)}</section>`;bind(d)}
function bind(d){document.getElementById('startTime').onchange=e=>{d.start=e.target.value;save();render()};document.querySelectorAll('.choice input').forEach(inp=>inp.onchange=e=>{d.stops[+e.target.dataset.index].selected=e.target.checked;save();render()});document.getElementById('addBtn').onclick=()=>{addTarget=d.id;document.getElementById('zoneSelect').innerHTML=d.zoneNames.map(z=>`<option>${z}</option>`).join('');document.getElementById('addDialog').showModal()};document.getElementById('clearBtn').onclick=()=>{d.stops.forEach(s=>{if(!s.must&&s.kind!=='start'&&s.kind!=='hotel'&&s.kind!=='transfer')s.selected=false});save();render()};document.getElementById('resetBtn').onclick=()=>{if(confirm('恢复这个行程的原计划？')){const original=baseline.find(x=>x.id===d.id);const fresh=JSON.parse(JSON.stringify(original));Object.assign(d,fresh);save();render()}}}
document.getElementById('addForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),d=dayData.find(x=>x.id===addTarget);const name=f.get('name').trim();if(!name)return;const zone=f.get('zone');if(!d.zoneNames.includes(zone))d.zoneNames.push(zone);d.stops.push({name,zone,rating:+f.get('rating'),duration:+f.get('duration'),travel:+f.get('travel'),level:'自定义',desc:f.get('desc')||'自定义景点',address:f.get('address')||name,selected:true});save();document.getElementById('addDialog').close();e.target.reset();activeDay=d.id;render();toast('已添加并选中：'+name)});document.getElementById('addDialog').addEventListener('click',e=>{if(e.target.id==='addDialog')e.target.close()});function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
render();
</script>
</body>
</html>
